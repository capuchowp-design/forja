<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FORJA — Planejador e Registro de Treinos</title>
<meta name="description" content="FORJA — planejador e registro de treinos com demonstrações em vídeo dos exercícios.">

<!-- PWA: permite "Adicionar à tela de início" e abrir em tela cheia, sem a barra do navegador -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a10">
<meta name="color-scheme" content="dark">

<!-- iOS: modo standalone (tela cheia) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Android/Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
:root{
  --primary:#8b5cf6; --primary-light:#a78bfa; --primary-dark:#6d28d9;
  --primary-glow:rgba(139,92,246,.35); --bg:#0a0a10; --bg-2:#0e0e16;
  --surface:#14141f; --surface-2:#1c1c2b; --border:rgba(255,255,255,.08);
  --text:#f4f4f8; --muted:#9a9aad; --green:#34d399; --red:#f87171;
  --amber:#fbbf24; --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  color:var(--text);background:#06060b;-webkit-font-smoothing:antialiased;
}
@media(min-width:560px){
  body{background:radial-gradient(900px 500px at 50% -10%,rgba(139,92,246,.18),transparent 60%),#06060b}
}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  box-shadow:0 0 80px rgba(0,0,0,.6)}
@media(min-width:560px){.shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:var(--text)}
a{color:inherit;text-decoration:none}
svg{display:block}

/* header */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:rgba(10,10,16,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.15rem;letter-spacing:.06em}
.logo-badge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));box-shadow:0 4px 16px var(--primary-glow)}
.top-act{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--muted);transition:.2s}
.icon-btn:hover{color:var(--primary-light);border-color:var(--primary)}

/* content */
#view{padding:18px 18px 110px;min-height:70vh;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-title{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.muted{color:var(--muted)} .small{font-size:.8rem} .tiny{font-size:.72rem}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-weight:800;font-size:.98rem;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 20px;border-radius:12px;
  font-weight:800;font-size:.9rem;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
  box-shadow:0 6px 20px var(--primary-glow)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:.8rem;border-radius:10px}
.btn-xs{padding:5px 10px;font-size:.72rem;border-radius:8px;font-weight:700}

/* chips & tags */
.tag{font-size:.66rem;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(139,92,246,.14);
  color:var(--primary-light);white-space:nowrap}
.tag-gray{background:var(--surface-2);color:var(--muted)}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;transition:.2s}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}

/* inputs */
.input{width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  font-size:.92rem;outline:none;transition:border .2s}
.input:focus{border-color:var(--primary)}
select.input{appearance:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}

/* stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat .v{font-size:1.35rem;font-weight:800;color:var(--primary-light)}
.stat .l{font-size:.68rem;color:var(--muted);margin-top:2px;font-weight:600}

/* exercise list */
.ex-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:border .2s}
.ex-item:hover{border-color:rgba(139,92,246,.5)}
.ex-ico{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  background:rgba(139,92,246,.13);color:var(--primary-light)}
.ex-item .n{font-weight:800;font-size:.88rem}
.ex-item .m{font-size:.72rem;color:var(--muted);margin-top:2px}

/* routine editor set config */
.setcfg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.setcfg .grp{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);
  font-weight:800;color:var(--primary-light);font-size:.9rem;display:grid;place-items:center}
.stepper b{min-width:26px;text-align:center;font-size:.88rem}

/* active workout */
.ex-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.ex-block.done{border-color:rgba(52,211,153,.4)}
.ex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ex-head .n{font-weight:800;font-size:.92rem}
.ex-head .m{font-size:.7rem;color:var(--muted)}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .sn{font-size:.75rem;font-weight:800;color:var(--muted);text-align:center}
.setrow input{background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:9px 6px;
  font-size:.85rem;font-weight:700;text-align:center;outline:none;width:100%}
.setrow input:focus{border-color:var(--primary)}
.setrow input.done{color:var(--green)}
.checkbtn{height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;transition:.2s;color:transparent;font-size:.9rem}
.checkbtn.on{background:var(--green);border-color:var(--green);color:#06281c;font-weight:900}
.ex-media{width:100%;border-radius:14px;background:#000;border:1px solid var(--border);margin-bottom:14px;display:block}
.ex-thumb{width:38px;height:38px;border-radius:11px;object-fit:cover;background:#000;border:1px solid var(--border);flex-shrink:0}
.prev-hint{font-size:.68rem;color:var(--amber);margin-bottom:8px;font-weight:600}

/* rest timer pill */
#timerPill{position:fixed;left:50%;transform:translate(-50%,90px);bottom:78px;z-index:80;
  background:var(--surface-2);border:1px solid var(--primary);border-radius:999px;padding:10px 18px;
  display:flex;align-items:center;gap:14px;font-weight:800;font-size:.9rem;
  box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px var(--primary-glow);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
#timerPill.show{transform:translate(-50%,0)}
#timerPill .t{color:var(--primary-light);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}

/* bottom nav */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:70;
  display:flex;background:rgba(14,14,22,.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  color:var(--muted);font-size:.62rem;font-weight:700;border-radius:10px;transition:.2s}
.nav-item.on{color:var(--primary-light)}
.nav-item .ind{width:4px;height:4px;border-radius:50%;background:transparent}
.nav-item.on .ind{background:var(--primary);box-shadow:0 0 8px var(--primary)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(4,4,8,.7);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.modal{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:22px 22px 0 0;padding:22px 20px 30px;animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 16px}

/* toast */
#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-70px);z-index:200;
  background:var(--surface-2);border:1px solid var(--primary);padding:11px 20px;border-radius:999px;
  font-size:.82rem;font-weight:800;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px var(--primary-glow);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;white-space:nowrap;max-width:92vw}
#toast.show{transform:translate(-50%,0)}

/* charts */
.chart{width:100%;height:auto}
.bar{width:100%;height:auto}

/* empty state */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{font-size:2.6rem;margin-bottom:12px;opacity:.9}

/* history */
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
.hist-item .n{font-weight:800;font-size:.88rem}
.hist-item .d{font-size:.72rem;color:var(--muted);margin-top:2px}

/* summary hero */
.summary-hero{text-align:center;padding:30px 20px;border-radius:var(--radius);margin-bottom:16px;
  background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(109,40,217,.08)),var(--surface);
  border:1px solid rgba(139,92,246,.35)}
.bigcheck{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--green);color:#06281c;font-size:1.8rem;font-weight:900;box-shadow:0 0 30px rgba(52,211,153,.4)}
.pr-banner{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:var(--amber);
  border-radius:12px;padding:10px 14px;font-weight:800;font-size:.82rem;margin-bottom:10px}
</style>
</head>

// Pede ao navegador pra tratar os dados do FORJA como "persistentes":
// reduz (não elimina) o risco do celular apagar os dados sozinho quando
// o armazenamento do aparelho fica cheio. Ainda assim, use o backup
// (botão 💾 no topo) de vez em quando — é a garantia real.
if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

function exportBackup(){
  const data=JSON.stringify(S,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date().toISOString().slice(0,10);
  a.href=url;a.download="forja-backup-"+d+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast("Backup baixado ✔");
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.routines)) throw new Error("formato inválido");
      S=data;save();closeModal();render();toast("Backup restaurado ✔");
    }catch(e){toast("Arquivo de backup inválido");}
  };
  reader.readAsText(file);
}

/* ---------------- CHARTS ---------------- */
function lineChart(pts,h){
  h=h||140;
  if(!pts.length)return '<p class="muted small" style="text-align:center;padding:20px 0">Sem dados ainda. Registre para ver o gráfico.</p>';
  const w=420,pad=28;
  const vals=pts.map(p=>p.v),min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const X=i=>pad+i*(w-pad-14)/Math.max(1,pts.length-1);
  const Y=v=>h-pad-((v-min)/span)*(h-pad-16);
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  const area=line+" L"+X(pts.length-1).toFixed(1)+","+(h-pad)+" L"+X(0).toFixed(1)+","+(h-pad)+" Z";
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="#a78bfa"/>').join("");
  const step=Math.ceil(pts.length/5);
  const labels=pts.map((p,i)=>i%step===0?'<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" fill="#9a9aad" font-size="9" text-anchor="middle">'+p.label+"</text>":"").join("");
  return '<svg class="chart" viewBox="0 0 '+w+" "+h+'"><path d="'+area+'" fill="rgba(139,92,246,.16)"/><path d="'+line+'" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+dots+labels+"</svg>";
}
function barChart(pts){
  if(!pts.length)return '<p class="muted small" style="text-align:center;padding:20px 0">Sem treinos registrados ainda.</p>';
  const w=420,h=140,pad=26,bw=(w-pad-14)/Math.max(pts.length,6);
  const max=Math.max(...pts.map(p=>p.v),1);
  const bars=pts.map((p,i)=>{const bh=(p.v/max)*(h-pad-16);
    return '<rect x="'+(pad+i*bw+bw*0.18).toFixed(1)+'" y="'+(h-pad-bh).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="#8b5cf6" opacity="0.9"><title>'+esc(p.full)+"</title></rect>"+
    (i%Math.ceil(pts.length/5)===0?'<text x="'+(pad+i*bw+bw/2).toFixed(1)+'" y="'+(h-6)+'" fill="#9a9aad" font-size="9" text-anchor="middle">'+p.label+"</text>":"");}).join("");
    return '<svg class="bar" viewBox="0 0 '+w+' '+h+'">'+bars+'</svg>';
}

/* ---------------- REST TIMER ---------------- */
function startRest(secs){
  restTotal=secs;restEnd=Date.now()+secs*1000;
  $("#timerPill").classList.add("show");
  clearInterval(restTimer);
  restTimer=setInterval(()=>{
    const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
    $("#timerTxt").textContent=fmtDur(left);
    if(left<=0){clearInterval(restTimer);$("#timerPill").classList.remove("show");
      if(navigator.vibrate)navigator.vibrate(200);}
  },250);
  $("#timerTxt").textContent=fmtDur(secs);
}

function shareRoutine(id){
  const r=S.routines.find(x=>x.id===id);if(!r)return;
  const data={name:r.name,exercises:r.exercises.map(e=>({exId:e.exId,sets:e.sets,reps:e.reps,weight:e.weight,rest:e.rest}))};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const link=location.origin+location.pathname+"#r="+b64;
  openModal(`<h2 style="font-size:1.05rem;font-weight:800;margin-bottom:12px">🔗 Compartilhar treino</h2>
    <p class="small muted" style="margin-bottom:12px">Envie este link — quem abrir no FORJA importa o treino com um toque.</p>
    <input class="input" style="margin-bottom:12px" readonly value="${esc(link)}" id="shareOut">
    <button class="btn btn-primary btn-block" data-action="copy-share">Copiar link</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="close-modal">Fechar</button>`);
}
function tryImport(){
  if(!location.hash.startsWith("#r="))return;
  try{
    const json=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
    if(json&&json.name&&Array.isArray(json.exercises)){importData=json;nav("import");}
  }catch(e){}
  location.hash="";
}

/* ---------------- FINISH WORKOUT ---------------- */
function finishWorkout(){
  const duration=Math.floor((Date.now()-active.start)/1000);
  const entry={id:uid2(),name:active.name,date:new Date().toISOString(),duration,
    volume:active.exercises.reduce((a,e)=>a+volumeOf(e),0),
    reps:active.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.reps||0),0),0),
    sets:active.exercises.reduce((a,e)=>a+e.sets.length,0),
    exercises:active.exercises.map(e=>({name:exById(e.exId).n,sets:e.sets.map(s=>({reps:s.reps,weight:s.weight}))}))};
  const newPRs=[];
  entry.exercises.forEach(e=>{
    const top=e.sets.reduce((b,s)=>(+s.weight||0)>(+b.weight||0)?s:b,e.sets[0]);
    if(!top)return;
    const cur=S.prs[e.name];
    if(!cur||(+top.weight||0)>(+cur.w||0)||((+top.weight||0)===(+cur.w||0)&&(+top.reps||0)>(+cur.reps||0))){
      S.prs[e.name]={w:+top.weight||0,reps:+top.reps||0};newPRs.push(e.name);}
  });
  S.history.push(entry);save();
  lastSummary={...entry,prs:newPRs};
  const wasActive=active;active=null;clearInterval(restTimer);$("#timerPill").classList.remove("show");
  nav("summary");
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  if(a==="nav")nav(el.dataset.view);
  if(a==="open-backup")openBackupModal();
  if(a==="backup-export")exportBackup();
  if(a==="backup-import-btn")$("#backupFileInput").click();
  if(a==="goto-routines")nav("routines");
  if(a==="new-routine"){editing={id:uid2(),name:"",exercises:[]};go("editor");}
  if(a==="edit-routine"){const r=S.routines.find(x=>x.id===id);
    editing={id:r.id,name:r.name,exercises:r.exercises.map(x=>({...x}))};go("editor");}
  if(a==="del-routine"){if(confirm("Excluir este treino?")){S.routines=S.routines.filter(x=>x.id!==id);save();render();}}
  if(a==="dup-routine"){const r=S.routines.find(x=>x.id===id);
    S.routines.push({id:uid2(),name:r.name+" (cópia)",exercises:r.exercises.map(x=>({...x}))});save();render();toast("Treino duplicado");}
  if(a==="share-routine")shareRoutine(id);
  if(a==="copy-share"){const i=$("#shareOut");i.select();
    navigator.clipboard?.writeText(i.value).catch(()=>document.execCommand("copy"));toast("Link copiado!");}
  if(a==="close-modal")closeModal();
  if(a==="close-modal-bg"&&e.target.classList.contains("modal-bg"))closeModal();
  if(a==="start-routine"){const r=S.routines.find(x=>x.id===id);
    active={name:r.name,start:Date.now(),exercises:r.exercises.map(x=>({exId:x.exId,
      sets:Array.from({length:x.sets},()=>({reps:x.reps,weight:x.weight,done:false}))}))};
    stack.length=0;cur={view:"active",params:null};render();toast("Treino iniciado. Bora! 🔥");}
  if(a==="resume-active"){cur={view:"active",params:null};render();}
  if(a==="add-ex"){pickerReturn=true;go("library");}
  if(a==="add-ex-active"){pickerReturn="active";go("library");}
  if(a==="pick-ex"){const exid=+el.dataset.id;
    if(pickerReturn==="active"){active.exercises.push({exId:exid,sets:[{reps:10,weight:0,done:false}]});
      pickerReturn=false;cur={view:"active",params:null};stack.pop();render();toast("Exercício adicionado");}
    else{editing.exercises.push({exId:exid,sets:3,reps:10,weight:0,rest:90});
      pickerReturn=false;cur={view:"editor",params:null};stack.pop();render();toast("Exercício adicionado");}}
  if(a==="ex-info")exInfoModal(+el.dataset.id);
  if(a==="ex-up"){const i=+el.dataset.i;[editing.exercises[i-1],editing.exercises[i]]=[editing.exercises[i],editing.exercises[i-1]];render();}
  if(a==="ex-down"){const i=+el.dataset.i;[editing.exercises[i+1],editing.exercises[i]]=[editing.exercises[i],editing.exercises[i+1]];render();}
  if(a==="ex-del"){editing.exercises.splice(+el.dataset.i,1);render();}
  if(a==="cfg"){const it=editing.exercises[+el.dataset.i],f=el.dataset.f,d=parseFloat(el.dataset.d);
    it[f]=Math.max(f==="sets"?1:0,(it[f]+d));render();}
  if(a==="save-routine"){editing.name=$("#edName").value.trim()||"Treino sem nome";
    const i=S.routines.findIndex(x=>x.id===editing.id);
    if(i>=0)S.routines[i]=editing;else S.routines.push(editing);
    save();editing=null;toast("Treino salvo ✔");nav("routines");}
  if(a==="lib-filter"){libFilter=el.dataset.g;render();}
  if(a==="set-done"){const ei=+el.dataset.ei,si=+el.dataset.si,s=active.exercises[ei].sets[si];
    s.done=!s.done;
    if(s.done){const orig=S.routines.flatMap(r=>r.exercises).find(x=>x.exId===active.exercises[ei].exId);
      startRest(orig?orig.rest:90);}
    render();}
  if(a==="add-set-active"){const ei=+el.dataset.ei,last=active.exercises[ei].sets.at(-1);
    active.exercises[ei].sets.push({reps:last.reps,weight:last.weight,done:false});render();}
  if(a==="del-set-active"){active.exercises[+el.dataset.ei].sets.splice(+el.dataset.si,1);render();}
  if(a==="timer-skip"){clearInterval(restTimer);$("#timerPill").classList.remove("show");}
  if(a==="fin-workout")finishWorkout();
  if(a==="abort-workout"){if(confirm("Descartar este treino? O progresso será perdido.")){active=null;clearInterval(restTimer);$("#timerPill").classList.remove("show");nav("home");}}
  if(a==="open-history")nav("history");
  if(a==="hist-del"){if(confirm("Excluir este registro?")){S.history=S.history.filter(h=>h.id!==id);save();render();}}
  if(a==="prog-ex"){progExId=el.value;render();}
  if(a==="meas-tab"){measTab=el.dataset.m;render();}
  if(a==="meas-add"){const v=parseFloat($("#measVal").value);
    if(isNaN(v))return toast("Digite um valor válido");
    S.measures[measTab].data.push({d:new Date().toISOString().slice(0,10),v});save();render();toast("Registrado ✔");}
  if(a==="meas-del"){S.measures[el.dataset.m].data.splice(+el.dataset.i,1);save();render();}
  if(a==="meas-new"){const name=prompt("Nome da métrica (ex.: Braço, Quadrilha):");if(!name)return;
    const unit=prompt("Unidade (ex.: cm, kg, %):")||"u";
    S.measures[name]={unit,data:[]};measTab=name;save();render();}
  if(a==="import-yes"){S.routines.push({id:uid2(),name:importData.name,exercises:importData.exercises});save();importData=null;toast("Treino importado ✔");nav("routines");}
  if(a==="import-no"){importData=null;nav("home");}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("[data-set-input]")){
    const ei=+t.dataset.ei,si=+t.dataset.si,f=t.dataset.f;
    active.exercises[ei].sets[si][f]=parseFloat(t.value)||0;
  }
  if(t.hasAttribute("data-action-lib")&&t.dataset.actionLib==="search"){libSearch=t.value.toLowerCase();
    clearTimeout(t._t);t._t=setTimeout(render,200);}
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-action]");
  if(el&&el.dataset.action==="prog-ex"){progExId=el.value;render();}
  if(e.target.id==="backupFileInput"&&e.target.files[0])importBackupFile(e.target.files[0]);
});

/* ---------------- BOOT ---------------- */
tryImport();
render();
</script>
</body>
</html>
